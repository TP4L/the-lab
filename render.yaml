# Render Blueprint for THE LAB app (companion/).
# Render dashboard -> New -> Blueprint -> pick this repo. You'll be asked for
# ADMIN_EMAIL and PUBLIC_URL. The disk keeps the database and uploads.
services:
  - type: web
    name: the-lab
    runtime: docker
    rootDir: companion
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: lab-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LAB_DB
        value: /data/lab.db
      - key: LAB_MEDIA_DIR
        value: /data/media
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Optional. Password-reset emails via resend.com (verify your domain there).
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional. Phone notifications: generate with `node server/push.js --keys`.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Optional. Sign in with Google (OAuth client, redirect URI PUBLIC_URL/api/auth/google/callback).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # A public demo with sample data. It keeps everything in memory, so it needs
  # no disk and starts fresh on every restart (and at least once a day).
  # No email, phone notifications or Google sign-in: nothing leaves the demo.
  - type: web
    name: the-lab-demo
    runtime: docker
    rootDir: companion
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "1"
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
